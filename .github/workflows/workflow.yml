name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check Spotless formatting
      run: ./gradlew spotlessCheck

    - name: Run static analysis
      run: ./gradlew check --no-build-cache

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      actions: read
    needs: code-quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew test --no-build-cache

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          build/test-results/**/*.xml

    - name: Upload test coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: build/reports/tests/

  native-image-build:
    name: Build Native Image
    runs-on: ubuntu-latest
    needs: [code-quality, tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up GraalVM JDK 24
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '24'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build native image
      run: ./gradlew nativeCompile --no-build-cache
      env:
        JAVA_TOOL_OPTIONS: "-XX:+UnlockExperimentalVMOptions -XX:+UseZGC"

    - name: Test native image
      run: ./gradlew nativeTest --no-build-cache

    - name: Upload native image artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-executable
        path: build/native/nativeCompile/auth-server-graalvm
        retention-days: 7

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [code-quality, tests, native-image-build]
    if: always()

    steps:
    - name: Check validation results
      run: |
        echo "## Pull Request Validation Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.code-quality.result }}" == "success" ]; then
          echo "✅ Code Quality & Formatting: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Code Quality & Formatting: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.tests.result }}" == "success" ]; then
          echo "✅ Tests: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Tests: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.native-image-build.result }}" == "success" ]; then
          echo "✅ Native Image Build: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Native Image Build: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Fail workflow if critical jobs failed
      if: needs.code-quality.result != 'success' || needs.tests.result != 'success' || needs.native-image-build.result != 'success'
      run: |
        echo "One or more critical validation steps failed"
        exit 1
